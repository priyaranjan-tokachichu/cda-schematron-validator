services:
  validator:
    build: .
    image: cda-validator:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VALIDATION_WORKERS: "2"
      # For shared deployments, supply API_TOKEN through your secret manager.
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/app.jar", "org.cdavalidator.HealthCheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
